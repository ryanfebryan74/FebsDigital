const cropFile=(f,n,tot)=>new Promise(res=>{

    $('#febs').appendChild(o);
    const cv=o.querySelector('.cpv'),ig=o.querySelector('img'),zr=o.querySelector('input');ig.src=url;
    const ap=()=>{const s=base*z,w=nw*s,h=nh*s;ox=Math.min(0,Math.max(VW-w,ox));oy=Math.min(0,Math.max(VH-h,oy));ig.style.width=w+'px';ig.style.height=h+'px';ig.style.transform='translate('+ox+'px,'+oy+'px)'};
